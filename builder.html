<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แต่งหน้าพิซซ่า</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-bar">
  <div class="screen">
    <div class="top">
      <a class="round" href="index.html">‹</a>
      <h2>แต่งพิซซ่าของคุณ</h2>
      <a class="round" href="cart.html">🛒<i id="cartN">0</i></a>
    </div>

    <div class="sticky">
      <div class="pills">
        <div class="seg" id="seg"></div>
        <button class="chip" id="sauceChip"><b id="sauceName">ซอสแดง</b><em id="sauceDot"></em></button>
      </div>
      <div class="stage">
        <div class="pz M" id="pz"><svg id="bSvg" viewBox="-160 -160 320 320"></svg></div>
      </div>
      <div class="cap" id="cap"></div>
    </div>

    <div id="menu"></div>
  </div>

  <div class="bar">
    <div>
      <button class="ico" id="undo"><span>↶</span>ยกเลิก</button>
      <button class="ico" id="clear"><span>🗑</span>ล้าง</button>
      <button class="cta" id="addBtn">เพิ่มลงตะกร้า</button>
    </div>
  </div>

  <div class="toast" id="toast">เพิ่มลงตะกร้าแล้ว</div>

  <script src="js/pizza.js"></script>
  <script src="js/builder.js"></script>
</body>
</html>
