<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แต่งหน้าพิซซ่า</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-bar">
  <div class="screen">

    <!-- ส่วนนี้ค้างอยู่ด้านบนตลอด: แถบหัว + ขนาด/ซอส + พิซซ่า -->
    <div class="sticky">
      <div class="top" style="padding:10px 0 2px">
        <a class="round" href="menu.html">‹</a>
        <h2 style="text-align:center">แต่งพิซซ่าของคุณ<small class="tpill" id="tablePill"></small></h2>
        <a class="round" id="cartBtn" href="cart.html">🛒<i id="cartN">0</i></a>
      </div>

      <div class="pills">
        <div class="seg" id="seg"></div>
        <button class="chip" id="sauceChip"><b id="sauceName">ซอสแดง</b><em id="sauceDot"></em></button>
      </div>
      <div class="stage">
        <div class="pz M" id="pz"><svg id="bSvg" viewBox="-160 -160 320 320"></svg></div>
      </div>
      <div class="cap" id="cap"></div>
    </div>

    <!-- รายการท็อปปิ้ง (ส่วนนี้เลื่อนอยู่ด้านล่าง) -->
    <div id="menu"></div>
  </div>

  <div class="bar">
    <div>
      <button class="ico" id="undo"><span>↶</span>ยกเลิก</button>
      <button class="ico" id="clear"><span>🗑</span>ล้าง</button>
      <button class="cta" id="addBtn">เพิ่มลงตะกร้า</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/pizza.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/builder.js"></script>
</body>
</html>
