<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ตะกร้าสินค้า</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .toast { width: max-content; max-width: 90vw; text-align: center; }
    .ci {
      padding: 14px; margin-bottom: 12px; border-radius: 18px; border: 1px solid var(--line);
      background: linear-gradient(160deg, #2c231c, #1f1813);
    }
    .ci-top { display: flex; justify-content: space-between; gap: 10px; }
    .ci h3 { font-size: 16px; font-weight: 600; }
    .ci .meta { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
    .ci .price { color: var(--gold); font-weight: 600; white-space: nowrap; }
    .ci-bot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
      background: rgba(255,255,255,.06); color: var(--text); font-size: 18px; cursor: pointer;
    }
    .del { background: none; border: 0; color: #e5736a; font: 500 13px "Prompt"; cursor: pointer; }
    .empty { text-align: center; padding: 60px 10px; color: var(--muted); }
    .tablebox {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; margin-top: 6px; border-radius: 18px;
      border: 1px solid var(--line); background: rgba(255,255,255,.05);
    }
    .tablebox label { font-weight: 600; font-size: 15px; }
    .tablebox input {
      width: 110px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: #14100d; color: var(--text); font: 600 16px "Prompt"; text-align: center;
    }
  </style>
</head>
<body class="has-bar">
  <div class="screen">
    <div class="sticky">
      <div class="top" style="padding:10px 0 12px">
        <a class="round" href="menu.html">‹</a>
        <h2>ตะกร้าของฉัน</h2>
        <span style="width:42px"></span>
      </div>
    </div>

    <div id="cartList" style="margin-top:6px"></div>

    <div class="tablebox" id="tableBox" hidden>
      <label for="tableInput">📍 หมายเลขโต๊ะ</label>
      <input id="tableInput" inputmode="numeric" maxlength="10" placeholder="เช่น 5">
    </div>

    <a class="ghost" href="menu.html">+ เลือกเมนูเพิ่ม</a>
  </div>

  <div class="bar" id="cartBar" hidden>
    <div>
      <button class="cta" id="checkoutBtn">ยืนยันสั่งอาหาร</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/cart.js"></script>
</body>
</html>
