<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ตะกร้าสินค้า</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ci {
      padding: 14px; margin-bottom: 12px; border-radius: 18px; border: 1px solid var(--line);
      background: linear-gradient(160deg, #2c231c, #1f1813);
    }
    .ci-row { display: flex; gap: 12px; }
    .ci-main { flex: 1; min-width: 0; }
    .ci-top { display: flex; justify-content: space-between; gap: 10px; }
    .ci h3 { font-size: 16px; font-weight: 600; }
    .ci .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
    .ci .price { color: var(--gold); font-weight: 600; white-space: nowrap; }
    .ci-bot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .del { background: none; border: 0; color: #e5736a; font: 500 13px "Prompt"; cursor: pointer; }
    .empty { text-align: center; padding: 60px 10px; color: var(--muted); }
    .tablebox {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; margin-top: 6px; border-radius: 18px;
      border: 1px solid var(--line); background: rgba(255,255,255,.05);
    }
    .tablebox label { font-weight: 600; font-size: 15px; }
    .tablebox input {
      width: 110px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: #14100d; color: var(--text); font: 600 16px "Prompt"; text-align: center;
    }
    .pay-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay {
      display: flex; flex-direction: column; gap: 2px; padding: 14px 12px; border-radius: 18px;
      border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer;
      font-weight: 600; font-size: 15px;
    }
    .pay input { display: none; }
    .pay small { color: var(--muted); font-weight: 400; font-size: 12px; }
    .pay.on { border-color: var(--gold); background: #2f2318; box-shadow: 0 0 0 1px var(--gold); }
    .pay.on small { color: var(--gold); }
    #qrBox { margin-top: 12px; padding: 16px; border-radius: 18px; text-align: center; background: #fff; color: #1a120c; }
    #qrBox img { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
    #qrBox p { margin-top: 8px; font-weight: 600; }
    #qrMissing { color: #8a5a3a; font-weight: 500; font-size: 13px; }
  </style>
</head>
<body class="has-bar">
  <div class="screen">
    <div class="sticky">
      <div class="top" style="padding:10px 0 12px">
        <a class="round" href="menu.html">‹</a>
        <h2 style="text-align:center">ตะกร้าของฉัน<small class="tpill" id="tablePill"></small></h2>
        <span style="width:42px"></span>
      </div>
    </div>

    <div id="cartList" style="margin-top:6px"></div>

    <div class="tablebox" id="tableBox" hidden>
      <label for="tableInput">📍 หมายเลขโต๊ะ</label>
      <input id="tableInput" inputmode="numeric" maxlength="10" placeholder="เช่น 5">
    </div>

    <div id="payBox" hidden>
      <h4>วิธีชำระเงิน</h4>
      <div class="pay-opts">
        <label class="pay"><input type="radio" name="pay" value="cash">💵 เงินสด<small>จ่ายที่เคาน์เตอร์</small></label>
        <label class="pay"><input type="radio" name="pay" value="qr">📱 สแกนจ่าย<small>สแกน QR ของร้าน</small></label>
      </div>
      <div id="qrBox" hidden>
        <img id="qrImg" src="assets/payment-qr.png" alt="QR ชำระเงิน">
        <p id="qrMissing" hidden>ร้านยังไม่ได้ตั้งค่ารูป QR ชำระเงิน</p>
        <p id="qrAmount"></p>
      </div>
    </div>

    <a class="ghost" href="menu.html">+ เลือกเมนูเพิ่ม</a>
  </div>

  <div class="bar" id="cartBar" hidden>
    <div>
      <button class="cta" id="checkoutBtn">ยืนยันสั่งอาหาร</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/pizza.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
