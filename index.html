<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pizza House</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== หน้าโลโก้ตอนเปิดเว็บ ===== */
    #splash {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 42%, #3a1f10 0%, #14100d 65%);
      transition: opacity .6s ease, transform .6s ease;
    }
    #splash.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
    .sp-logo {
      position: relative; width: 110px; height: 110px; border-radius: 34px;
      display: flex; align-items: center; justify-content: center; font-size: 60px;
      background: linear-gradient(135deg, #ff5a4d, #ff8a3d);
      box-shadow: 0 0 50px rgba(255,120,40,.6);
      animation: logoIn .9s cubic-bezier(.3,1.5,.5,1) both;
    }
    .sp-logo::after {
      content: ""; position: absolute; inset: -14px; border-radius: 44px;
      border: 2px solid rgba(255,190,90,.6);
      animation: ring 1.6s ease-out infinite;
    }
    @keyframes logoIn {
      from { transform: scale(.2) rotate(-40deg); opacity: 0; }
      to   { transform: scale(1) rotate(-6deg); opacity: 1; }
    }
    @keyframes ring {
      from { transform: scale(.85); opacity: .9; }
      to   { transform: scale(1.35); opacity: 0; }
    }
    .sp-name {
      margin-top: 24px; font: 900 38px "Playfair Display", serif; color: #f7efe6;
      animation: up .7s .5s both;
    }
    .sp-sub {
      margin-top: 4px; letter-spacing: 3px; font-size: 12px; font-weight: 600; color: #dcb46c;
      animation: up .7s .7s both;
    }
    @keyframes up {
      from { transform: translateY(14px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    .sp-stars { display: flex; gap: 8px; margin-top: 16px; font-size: 28px; color: #ffc857; }
    .sp-stars span {
      text-shadow: 0 0 14px rgba(255,190,60,.9);
      animation: pop .5s cubic-bezier(.3,1.6,.5,1) both;
    }
    @keyframes pop {
      from { transform: scale(0) rotate(-90deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }
    .sp-spark {
      position: absolute; color: #ffd98a; pointer-events: none;
      animation: tw 1.6s ease-in-out infinite;
    }
    @keyframes tw {
      0%, 100% { opacity: 0; transform: scale(.3); }
      50%      { opacity: 1; transform: scale(1); }
    }

    /* ===== ป้ายสแกนสำเร็จ ===== */
    .badge.scan-ok {
      border-color: #3fae5a; color: #8be2a2; background: rgba(63,174,90,.12);
      font-weight: 600; font-size: 14px;
      animation: scanPop .6s cubic-bezier(.3,1.6,.5,1) both;
      animation-delay: var(--d, 0s);
    }
    @keyframes scanPop {
      from { transform: scale(.4); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- หน้าโลโก้: แสดงประมาณ 3 วินาที กดที่หน้าจอเพื่อข้ามได้ -->
  <div id="splash">
    <div class="sp-logo">🍕</div>
    <div class="sp-name">Pizza House</div>
    <div class="sp-sub">อบสด · แต่งเองได้</div>
    <div class="sp-stars">
      <span style="animation-delay:1.0s">★</span>
      <span style="animation-delay:1.2s">★</span>
      <span style="animation-delay:1.4s">★</span>
      <span style="animation-delay:1.6s">★</span>
      <span style="animation-delay:1.8s">★</span>
    </div>
  </div>
  <script>
    var splashShown = false;
    (function () {
      var sp = document.getElementById("splash");
      var seen = false;
      try { seen = sessionStorage.getItem("splashSeen") === "1"; } catch (e) {}
      // เติม splash=1 ท้ายลิงก์ เพื่อบังคับให้แสดงอีกครั้ง (ใช้ตอนทดสอบ)
      if (new URLSearchParams(window.location.search).get("splash") === "1") seen = false;

      if (seen) { sp.remove(); return; }
      splashShown = true;
      try { sessionStorage.setItem("splashSeen", "1"); } catch (e) {}

      // ประกายดาวกระพริบรอบ ๆ
      for (var i = 0; i < 18; i++) {
        var s = document.createElement("span");
        s.className = "sp-spark";
        s.textContent = "✦";
        s.style.left = Math.random() * 96 + "%";
        s.style.top = Math.random() * 96 + "%";
        s.style.fontSize = 10 + Math.random() * 16 + "px";
        s.style.animationDelay = Math.random() * 1.6 + "s";
        s.style.animationDuration = 1.2 + Math.random() * 1.2 + "s";
        sp.appendChild(s);
      }

      var closed = false;
      function closeSplash() {
        if (closed) return;
        closed = true;
        sp.classList.add("out");
        setTimeout(function () { sp.remove(); }, 650);
      }
      setTimeout(closeSplash, 3000);   // 3000 = 3 วินาที (แก้ตัวเลขนี้เพื่อปรับเวลา)
      sp.onclick = closeSplash;
    })();
  </script>

  <!-- ===== หน้าร้าน ===== -->
  <div class="screen home">
    <h1>Pizza</h1>
    <div class="rule"></div>
    <div class="sub">อบสด · แต่งเองได้</div>
    <div id="tableBadge"></div>

    <div class="stage" style="margin-top:12px">
      <div class="pz L"><svg id="homeSvg" viewBox="-160 -160 320 320"></svg></div>
    </div>

    <p class="tag">เลือกแต่งพิซซ่าได้ตามใจคุณ</p>
    <a class="cta" href="builder.html">แต่งพิซซ่าของคุณ →</a>
    <a class="ghost" href="menu.html">ดูเมนู</a>
  </div>

  <script src="js/pizza.js"></script>
  <script>
    // วาดพิซซ่ามาร์เกอริตาบนหน้าแรก
    var home = new Pizza(document.getElementById("homeSvg"));
    home.add({ id: "cheese", s: "moz", k: 9 });
    home.add({ id: "basil", s: "basil", k: 7 });

    // ===== ระบบโต๊ะ =====
    // QR ประจำโต๊ะลิงก์มาแบบนี้: .../pizza-restaurant/?table=5
    var params = new URLSearchParams(window.location.search);
    var table = params.get("table");
    var badge = document.getElementById("tableBadge");

    if (table) {
      // ลูกค้าเพิ่งสแกนเข้ามา: จำโต๊ะไว้ แล้วโชว์ป้ายสแกนสำเร็จ
      table = table.replace(/[^0-9A-Za-z_-]/g, "").slice(0, 10);
      try { localStorage.setItem("table", table); } catch (e) {}
      var d = splashShown ? 3.1 : 0.1;   // รอให้หน้าโลโก้จบก่อน
      badge.innerHTML =
        '<span class="badge scan-ok" style="--d:' + d + 's;opacity:0">✅ สแกนสำเร็จ · โต๊ะ ' + table + "</span>";
    } else {
      // เข้ามาโดยไม่ได้สแกน: ถ้าเคยมีโต๊ะที่จำไว้ ก็โชว์ป้ายปกติ
      var saved = null;
      try { saved = localStorage.getItem("table"); } catch (e) {}
      if (saved) {
        badge.innerHTML = '<span class="badge">📍 โต๊ะ ' + saved + "</span>";
      }
    }
  </script>
</body>
</html>
